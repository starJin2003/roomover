# Roomover on Render. One always on web service, a daily reseed cron job, an
# hourly demo release cron job, and the roomover-db Postgres instance, all in
# Ohio so every service reaches the database over the private network. Secret
# values live only in the Render dashboard (sync false).
services:
  - type: web
    name: roomover
    runtime: node
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    # Node 26 comes from .nvmrc. Node 26 ships without Corepack, so the build
    # installs it to run the pnpm version pinned in package.json.
    buildCommand: npm install --global corepack@0.36.0 && corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    # npm runs the package scripts from node_modules/.bin, so the pre-deploy and
    # runtime instances need no pnpm.
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomover-db
          property: connectionString
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

  # Moves the demo listing windows to the current campus day so a judge always
  # finds a winter cart that authorizes. Schedules run in UTC, so 10:00 is 04:00
  # Central in winter and 05:00 in summer. The seed skips listings that open
  # orders hold and deletes nothing.
  - type: cron
    name: roomover-reseed
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    schedule: "0 10 * * *"
    autoDeployTrigger: commit
    buildCommand: npm install --global corepack@0.36.0 && corepack enable pnpm && pnpm install --frozen-lockfile
    startCommand: npm run db:seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomover-db
          property: connectionString
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"

  # Gives the money back on demo orders whose handoff did not start within 2
  # hours of approval (a void, or a refund in capture mode) and puts their
  # listings back on sale, so judges who pay and leave do not empty the
  # catalog. The PayPal credentials come from the web service.
  - type: cron
    name: roomover-release
    runtime: node
    region: ohio
    plan: 0.5c-512mb
    schedule: "0 * * * *"
    autoDeployTrigger: commit
    buildCommand: npm install --global corepack@0.36.0 && corepack enable pnpm && pnpm install --frozen-lockfile
    startCommand: npm run orders:release
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomover-db
          property: connectionString
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: PAYPAL_CLIENT_ID
        fromService:
          name: roomover
          type: web
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          name: roomover
          type: web
          envVarKey: PAYPAL_CLIENT_SECRET

databases:
  # Adopted by name. The instance already exists, so its plan, disk, version,
  # and database name stay as they are.
  - name: roomover-db
    region: ohio
