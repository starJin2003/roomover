# Roomover on Render. One always on web service and the roomover-db Postgres
# instance, both in Ohio so the app reaches the database over the private
# network. Secret values live only in the Render dashboard (sync false).
services:
  - type: web
    name: roomover
    runtime: node
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    # Node 26 comes from .nvmrc. Node 26 ships without Corepack, so the build
    # installs it to run the pnpm version pinned in package.json.
    buildCommand: npm install --global corepack@0.36.0 && corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    # npm runs the package scripts from node_modules/.bin, so the pre-deploy and
    # runtime instances need no pnpm.
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomover-db
          property: connectionString
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  # Adopted by name. The instance already exists, so its plan, disk, version,
  # and database name stay as they are.
  - name: roomover-db
    region: ohio
